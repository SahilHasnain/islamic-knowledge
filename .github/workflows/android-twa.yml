name: Build Android TWA

on:
  workflow_dispatch:
    inputs:
      artifact:
        description: Which release artifact to upload
        type: choice
        required: true
        default: aab
        options:
          - apk
          - aab
  push:
    branches:
      - main
    paths:
      - "mobile/twa/**"
      - ".github/workflows/android-twa.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build selected signed Android artifact
    runs-on: ubuntu-latest
    env:
      PACKAGE_TYPE: ${{ inputs.artifact || 'aab' }}
    defaults:
      run:
        working-directory: mobile/twa

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Bubblewrap Android project exists
        shell: bash
        run: |
          if [[ ! -f gradlew ]]; then
            echo "Bubblewrap Android project is missing (mobile/twa/gradlew not found)."
            echo "Run 'bubblewrap init --manifest=https://darulkutub.durood.live/manifest.webmanifest' locally, confirm package ID com.darulkutub, and commit the generated Android project files."
            exit 1
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-36 build-tools;36.1.0

      - name: Configure upload signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.BUBBLEWRAP_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "Missing GitHub Actions secret BUBBLEWRAP_KEYSTORE_BASE64."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android.keystore

      - name: Build and sign selected release artifact
        id: build
        shell: bash
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.BUBBLEWRAP_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.BUBBLEWRAP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew

          if [[ "$PACKAGE_TYPE" == "apk" ]]; then
            ./gradlew assembleRelease
            "$ANDROID_HOME/build-tools/36.1.0/zipalign" -v -f -p 4 \
              app/build/outputs/apk/release/app-release-unsigned.apk \
              app-release-unsigned-aligned.apk
            "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
              --ks android.keystore \
              --ks-key-alias darulkutub \
              --ks-pass "pass:$BUBBLEWRAP_KEYSTORE_PASSWORD" \
              --key-pass "pass:$BUBBLEWRAP_KEY_PASSWORD" \
              --out app-release-signed.apk \
              app-release-unsigned-aligned.apk
            echo "path=mobile/twa/app-release-signed.apk" >> "$GITHUB_OUTPUT"
            echo "name=dar-al-kutub-apk-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            ./gradlew bundleRelease
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore android.keystore \
              app/build/outputs/bundle/release/app-release.aab \
              darulkutub \
              -storepass "$BUBBLEWRAP_KEYSTORE_PASSWORD" \
              -keypass "$BUBBLEWRAP_KEY_PASSWORD" \
              -signedjar app-release-bundle.aab
            echo "path=mobile/twa/app-release-bundle.aab" >> "$GITHUB_OUTPUT"
            echo "name=dar-al-kutub-aab-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload selected artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.path }}
          if-no-files-found: error
          retention-days: 14
