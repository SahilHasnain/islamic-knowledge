            - listitem [ref=f63e295]: (تیری دعا سے قضا تو بدل نہیں سکتی) Teri Dua Se Qaza Tou Badal Nahin Sakti
            - listitem [ref=f63e296]: (کیا چرخ کج رو ، کیا مہر، کیا ماہ) Kya Charkh-e-Kaj Ro, Kya Mehar, Kya Mah
            - listitem [ref=f63e297]: (یہ مدرسہ یہ کھیل یہ غوغاۓ روارو) Ye Madrasa Ye Khail Ye Ghogha’ay Rawa Ro
            - listitem [ref=f63e298]: (جوعالم ایجاد میں ہے صاحب ایجاد) Jo Alam-e-Ejad Mein Hai Sahib-e-Ejad
            - listitem [ref=f63e299]: (رومی بدلے، شامی بدلے، بدلا ہندوستان) Rumi Badle, Shami Badle, Badla Hindustan
            - listitem [ref=f63e300]: (زاغ کہتا ہے نہایت بدنما ہیں تیرے پر) Zagh Kehta Hai Nahayat Badnuma Hain Tere Per
            - listitem [ref=f63e301]: (عشق طنیت میں فرو مایہ نہیں مثل ہوس) Ishq Tiniat Mein Firo Maya Nahin Misal-e-Hawas
            - listitem [ref=f63e302]: (وہی جوان ہے قبیلے کی آنکہ کا تارا) Wohi Jawan Hai Qabile Ki Ankh Ka Tara
            - listitem [ref=f63e303]: (جس کے پرتو سے منور رہی تیری شب دوش) Jis Ke Parto Se Munawwar Rahi Teri Shab-e-Dosh
            - listitem [ref=f63e304]: (لادینی و لا طینی، کس پیچ میں الجھا ہے تو) La Deeni-o-La Teeni, Kis Paich Mein Uljha Tu
            - listitem [ref=f63e305]: (مجھ کو تو یہ دنیا نظر اتی ہے دگرگوں) Mujh Ko To Ye Duniya Nazar Ati Hai Digargoon
