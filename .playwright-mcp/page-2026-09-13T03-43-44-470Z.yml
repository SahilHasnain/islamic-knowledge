            - listitem [ref=f63e293]: (محراب گل افغان کے افکار – میرے کوہستان تجھے چھوڑ کے جاؤں کہاں) Mehrab Gul Afghan Ke Afkar – Mere Kohistan ! Tujhe Chor Ke Jaun Kahan
