                - listitem [ref=f32e87]:
                  - link "(میری نوا شوق سے شور حریم ذات میں) Meri Nawa-e-Shauq Se Shor Hareem-e-Zaat Mein" [ref=f32e88] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/meri-nawa-e-shauk/
                - listitem [ref=f32e89]:
                  - link "(اگر کج رو ہیں انجم, آسمان تیرا ہے یا میرا) Agar Kaj Ro Hain Anjum, Asman Tera Hai Ya Mera" [ref=f32e90] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/agar-kaj-ro-hain-anjum-asman-tera-hai-ya-mera/
                - listitem [ref=f32e91]:
                  - link "(تیرے شیشے میں مے باقی نہیں ہے) Tere Shishe Mein Mai Baqi Nahin Hai" [ref=f32e92] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/tere-shishe-mein-mai-baqi-nahin-hai/
                - listitem [ref=f32e93]:
                  - link "(گیسوۓ تابدار کو اور بھی تابدار کر) Gaisu-e-Tabdar Ko Aur Bhi Tabdar Kar" [ref=f32e94] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/gaisu-e-tabdar-ko-aur-bhi-tabdar-kar/
                - listitem [ref=f32e95]:
                  - link "(اثر کرے نہ کرے، سن تو لے میری فریاد) Asar Kare Na Kare, Sun To Le Meri Faryad" [ref=f32e96] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/asar-kare-na-kare-sun-to-le-meri-faryad/
                - listitem [ref=f32e97]:
                  - link "(کیا عشق ایک زندگی مستعار کا) Kya Ishq Aik Zindagi-e-Mastaar Ka" [ref=f32e98] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/kya-ishq-aik-zindagi-e-mastaar-ka/
                - listitem [ref=f32e99]:
                  - link "(دلوں کو مرکز مہر و وفا کر) Dilon Ko Markaz-e-Mehar-o-Wafa Kar" [ref=f32e100] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/dilon-ko-markaz-e-mehar-o-wafa-kar/
                - listitem [ref=f32e101]:
                  - link "(پریشان ہو کے میری خاک آخر دل نہ بن جائے) Preshan Ho Ke Meri Khak Akhir Dil Na Ban Jaye" [ref=f32e102] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/preshaan-ho-ke-meri-khaak/
                - listitem [ref=f32e103]:
                  - link "(دگرگوں ہے جہاں، تاروں کی گردش تیز ہے ساقی) Digargoon Hai Jahan, Taron Ki Gardish Taez Hai Saqi" [ref=f32e104] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/digargoon-hai-jahan-taron-ki-gardish-taez-hai-saqi/
                - listitem [ref=f32e105]:
                  - link "(لا پھر ایک بار وہی بادہ و جام اے ساقی) La Phir Aik Bar Wohi Badah-o-Jaam Ae Saqi" [ref=f32e106] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/la-phir-aik-bar-wohi-badah-o-jaam-ae-saqi/
                - listitem [ref=f32e107]:
                  - link "(مٹا دیا میرے ساقی نے عالم من و تو) Mita Diya Mere Saqi Ne Alam-e-Mann-o-Tu" [ref=f32e108] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/mita-diya-mere-saqi-ne-alam-e-maan-o-tu/
                - listitem [ref=f32e109]:
                  - link "(متاع بےبہا ہے درد و سوز آرزو مندی) Mata-e-Bebaha Hai Dard-o-Souz-e-Arzoo Mandi" [ref=f32e110] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/mata-e-bebaha-hai-dard-o-souz-e-arzoo-mandi/
                - listitem [ref=f32e111]:
                  - link "(تجھے یاد کیا نہیں ہے میرے دل کا وہ زمانہ) Tujhe Yaad Kya Nahin Hai Mere Dil Ka Woh Zamana" [ref=f32e112] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/tujhe-yaad-kya-nahin-hai-mere-dil-ka-woh-zamana/
                - listitem [ref=f32e113]:
                  - link "(ضمیر لالہ مے لعل سے ہوا لبریز) Zameer-e-Lala Mai-e-Laal Se Huwa Labraiz" [ref=f32e114] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/zameer-e-lala-mai-e-laal-se-huwa-labraiz/
                - listitem [ref=f32e115]:
                  - link "(وہی میری کم نصیبی، وہی تیری بے نیازی) Wohi Meri Kam Naseebi, Wohi Teri Be-Niazi" [ref=f32e116] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/wohi-meri-kam-naseebi-wohi-teri-be-niazi/
                - listitem [ref=f32e117]:
                  - link "(اپنی جولاں گاہ زیر آسمان سمجھا تھا) Apni Jolangah Zair-e-Asman Samjha Tha Main" [ref=f32e118] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/apni-jolangah-zair-e-asman-samjha-tha-main/
                - listitem [ref=f32e119]:
                  - link "(اک دانش نورانی، اک دانش برہانی) Ek Danish-e-Noorani, Ek Danish-e-Burhani" [ref=f32e120] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/ek-danish-e-noorani-ek-danish-e-burhani/
                - listitem [ref=f32e121]:
                  - link "(یا رب ! یہ جہاں گزرن خوب ہے لیکن) Ya Rab ! Ye Jahan-e-Guzran Khoob Hai Lekin" [ref=f32e122] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/ya-rab-ye-jahan-e-guzran-khoob-hai-lekin/
                - listitem [ref=f32e123]:
                  - link "(سما سکتا نہیں پہناے فطرت میں میرا سودا) Sama Sakta Nahin Pehna’ay Fitrat Mein Mera Soda" [ref=f32e124] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/sama-sakta-nahin-pehnaay-fitrat-mein-mera-soda/
                - listitem [ref=f32e125]:
                  - link "(بہت دیکھے ہیں میں نے مشرق و مغرب کے مے خانے) Bohat Dekhe Hain Main Ne Mashriq-o-Maghrib Ke Maikhane" [ref=f32e126] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/bohat-dekhe-hain-main-ne-mashriq-o-maghrib-ke-maikhane/
                - listitem [ref=f32e127]:
                  - link "(غلامی کیا ہے؟ ذوق و حسن و زیبائی سے محرومی) Ghulami Kya Hai? Zauq-e-Husn-o-Zaibai Se Mehroomi" [ref=f32e128] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/ghulami-kya-hai/
                - listitem [ref=f32e129]:
                  - link "(یہ کون غزل خواں ہے ، پر سوز و نشاط انگیز) Ye Kon Ghazal Khawan Hai, Pur Soz-o-Nishat Angaiz" [ref=f32e130] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/ye-kon-ghazal-khawan-hai-pur-soz-o-nishat-angaiz/
                - listitem [ref=f32e131]:
                  - link "(وہ حرف راز کے مجھ کو سکھا گیا ہے جنوں) Woh Harf-e-Raaz Ke Mujh Ko Sikha Gaya Hai Junoon" [ref=f32e132] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/woh-harf-e-raaz-ke-mujh-ko-sikha-gaya-hai-junoon/
                - listitem [ref=f32e133]:
                  - link "(عالم و آب و خاک و باد! سر عیاں ہے تو کہ میں) Alam-e-Aab-o-Khak-o-Bad ! Sir-e-Ayan Hai Tu Ke Main" [ref=f32e134] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/alam-e-aab-o-khak-o-bad-sir-e-ayan-hai-tu-ke-main/
                - listitem [ref=f32e135]:
                  - link "(تو ابھی رہ گزر میں ہے، قید مقام سے گزر) Tu Abhi Reh Guzar Mein Hai, Qaid-e-Maqam Se Guzar" [ref=f32e136] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/tu-abhi-reh-guzar-mein-hai/
                - listitem [ref=f32e137]:
                  - link "(امین راز ہے مردان حر کی درویشی) Amin-e-Raaz Hai Mardan-e-Hur Ki Darvaishi" [ref=f32e138] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/amin-e-raaz-hai-mardan-e-hur-ki-darvaishi/
                - listitem [ref=f32e139]:
                  - link "(پھر چراغ لالہ سے روشن ھوۓ کوہ و دمن) Phir Charagh-e-Lala Se Roshan Huay Koh-o-Daman" [ref=f32e140] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/phir-charagh-e-lala-se-roshan-huay-koh-o-daman/
                - listitem [ref=f32e141]:
                  - link "(مسلمان کے لہو میں ہے، سلیقہ دل نوازی کا) Musalman Ke Lahoo Mein Hai, Saliqa Dil Nawazi Ka" [ref=f32e142] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/musalman-ke-lahoo-mein-hai-saliqa-dil-nawazi-ka/
                - listitem [ref=f32e143]:
                  - link "(عشق سے پیدا نواۓ زندگی میں زیر و بم) Ishq Se Paida Nuwa’ay Zindagi Mein Zair-o-Bam" [ref=f32e144] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/ishq-se-paida-nuwaay-zindagi-mein-zair-o-bam/
                - listitem [ref=f32e145]:
                  - link "(دل سوز سے خالی ہے ، نگاہ پاک نہیں ہے) Dil Soz Se Khali Hai, Nigah Pak Nahin Hai" [ref=f32e146] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/dil-soz-se-khali-hai-nigah-pak-nahin-hai/
                - listitem [ref=f32e147]:
                  - link "(ہزار خوف ہو لیکن زبان ہو دل کی رفیق) Hazar Khof Ho Lekin Zuban Ho Dil Ki Rafeeq" [ref=f32e148] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/hazar-khof-ho-lekin-zuban-ho-dil-ki-rafeeq-2/
                - listitem [ref=f32e149]:
                  - link "(پوچھ اس سے کے مقبول ہے فطرت کی گواہی) Pooch Iss Se Ke Maqbool Hai Fitrat Ki Gawahi" [ref=f32e150] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/pooch-iss-se-ke-maqbool-hai-fitrat-ki-gawahi/
                - listitem [ref=f32e151]:
                  - link "(یہ حوریں فرنگی، دل و نظر کا حجاب) Ye Hooriyan-e-Farangi, Dil-o-Nazar Ka Hijab" [ref=f32e152] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/ye-hooriyan-e-farangi/
                - listitem [ref=f32e153]:
                  - link "(دل بیدار فاروقی، دل بیدار کراری) Dil-e-Baidar Farooqi, Dil-e-Baidar Karrari" [ref=f32e154] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/dil-e-baidar-farooqi/
                - listitem [ref=f32e155]:
                  - link "(خودی کی شوخی و تندی میں کبر و ناز نہیں) Khudi Ki Shaukhi-o-Tundi Mein Kibar-o-Naz Nahin" [ref=f32e156] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/khudi-ki-shokhi-o-tundi-mein-kubr-o-naaz-nahin/
                - listitem [ref=f32e157]:
                  - link "(میر سپاہ نا سزا، لشکر یاں شکستہ صف) Mir-e-Sipah Na Saza, Lashkar Yaan Shakistah Saf" [ref=f32e158] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/mir-e-sipah-na-saza-lashkar-yaan-shakistah-saf/
                - listitem [ref=f32e159]:
                  - link "(زمستانی ہوا میں گرچہ تھی شمشیر کی تیزی) Zamistani Hawa Mein Garcha Thi Shamsheer Ki Taizi" [ref=f32e160] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/zamistani-hawa-mein-garcha-thi-shamsheer-ki-taizi/
                - listitem [ref=f32e161]:
                  - link "(یہ دیر کہن ہے، عنبر خس و خاشاک) Ye Dair-e-Kuhan Hai, Anbar-e-Khas-o-Khashaak" [ref=f32e162] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/ye-dair-e-kuhan-hai-anbar-e-khas-o-khashaak/
                - listitem [ref=f32e163]:
                  - link "(کمال ترک نہیں آب و گل سے مہجوری) Kamal-e-Tark Nahin Aab-o-Gill Se Mahjoori" [ref=f32e164] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/kamal-e-tark-nahin-aab-o-gill-se-mahjoori/
                - listitem [ref=f32e165]:
                  - link "(عقل گو آستان سے دور نہیں) Aqal Go Aastan Se Door Nahin" [ref=f32e166] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/aqal-go-aastan-se-door-nahin/
                - listitem [ref=f32e167]:
                  - link "(خودی وہ بحر ہے جس کا کوئی کنارہ نہیں) Khudi Woh Beher Hai Jis Ka Koi Kinara Nahin" [ref=f32e168] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/khudi-woh-beher-hai-jis-ka-koi-kinara-nahin/
                - listitem [ref=f32e169]:
                  - link "(یہ پیام دے گئی ہے مجھے باد صبح گاہی) Ye Peyam De Gayi Hai Mujhe Bad-e-Subah Gahi" [ref=f32e170] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/ye-peyam-de-gayi-hai-mujhe-bad-e-subah-gahi/
                - listitem [ref=f32e171]:
                  - link "(تیری نگاہ فرو مایہ، ہاتھ ہے کوتاہ) Teri Nigah Firo Maya, Hath Hai Kotah" [ref=f32e172] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/teri-nigah-firo-maya-hath-hai-kotah/
                - listitem [ref=f32e173]:
                  - link "(خرد کے پاس خبر کے سوا کچھ بھی نہیں) Kirad Ke Paas Khabar Ke Siwa Kuch Aur Nahin" [ref=f32e174] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/kirad-ke-paas-khabar-ke-siwa-kuch-aur-nahin/
                - listitem [ref=f32e175]:
                  - link "(نگاہ فقر میں شان سکندری کیا ہے) Nigah-e-Faqar Mein Shan-e-Sikandari Kya Hai" [ref=f32e176] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/nigah-e-faqar-mein-shan-e-sikandari-kya-hai/
                - listitem [ref=f32e177]:
                  - link "(نہ تو زمین کے لئے ہے نہ آسمان کے لئے) Na Tu Zameen Ke Liye Hai Na Asman Ke Liye" [ref=f32e178] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/na-tu-zameen-ke-liye-hai-na-asman-ke-liye/
                - listitem [ref=f32e179]:
                  - link "(تو اے اسیر مکان ! لا مکان سے دور نہیں) Tu Ae Aseer-e-Makan ! La Makan Se Door Nahin" [ref=f32e180] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/tu-ae-aseer-e-makan/
                - listitem [ref=f32e181]:
                  - link "(خرد نے مجھ کو عطا کی نظر حکیمانہ) Kirad Ne Mujh Ko Atta Ki Nazar Hakeemana" [ref=f32e182] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/kirad-ne-mujh-ko-atta-ki-nazar-hakeemana/
                - listitem [ref=f32e183]:
                  - link "(افلاک سے اتا ہے نالوں کا جواب آخر) Aflak Se Ata Hai Nalon Ka Jawab Akhir" [ref=f32e184] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/aflak-se-ata-hai-nalon-ka-jawab-akhir/
                - listitem [ref=f32e185]:
                  - link "(ہر شے مسافر، ہر چیز راہی) Har Shay Musafir, Har Cheez Rahi" [ref=f32e186] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/armaghan-e-hijaz/har-shay-musafir-har-cheez-rahi/
                - listitem [ref=f32e187]:
                  - link "(ہر چیز ہے محو خود نمائی) Har Cheez Hai Mehew-e-Khud Numai" [ref=f32e188] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/har-cheez-hai-mehew-e-khud-numai/
                - listitem [ref=f32e189]:
                  - link "(اعجاز ہے کسی کا یا گردش زمانہ) Ejaz Hai Kissi Ka Ya Gardish-e-Zamana !" [ref=f32e190] [cursor=pointer]:
                    - /url: https://allamaiqbal.org/bal-e-jibril/ejaz-hai-kissi-ka-ya-gardish-e-zamana/
                - listitem [ref=f32e191]:
                  - link "(خرد مندوں سے کیا پوچھوں کہ میری ابتدا کیا ہے) Khirad Mandon Se Kya Poochun Ke Meri Ibtada Kya Hai" [ref=f32e192] [cursor=pointer]:
